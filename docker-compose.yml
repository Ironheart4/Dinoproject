# DinoProject - Docker Compose
# Run: docker-compose up -d
# Note: Database is hosted on Supabase (no local PostgreSQL needed)

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dinoproject-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_PROFILE_BUCKET: ${SUPABASE_PROFILE_BUCKET:-profile-pictures}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      PORT: 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Production build with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinoproject-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
